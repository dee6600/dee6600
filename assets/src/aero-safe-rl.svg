<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="878" viewBox="0 0 1200 878" role="img" aria-labelledby="title desc">
  <title id="title">Learned recovery from partial rotor faults in PX4 quadrotors</title>
  <desc id="desc">A line drawing of a quadrotor with rotor 3 highlighted. PX4's built-in failure detector stayed silent on all 178 mild-fault flights. The learned policy finishes 98 percent versus 29 percent of missions at 20 to 35 percent thrust loss, and 21 versus 1 percent just below the hover limit, across 9,054 pre-registered PX4 flights.</desc>
  <defs>
    <linearGradient id="dusk" x1="0" x2="1">
      <stop offset="0" stop-color="#2F6FDB"/>
      <stop offset=".6" stop-color="#2C8FB0"/>
      <stop offset="1" stop-color="#23955A"/>
    </linearGradient>
    <radialGradient id="glow" cx="1080" cy="0" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F6FDB" stop-opacity=".07"/>
      <stop offset="1" stop-color="#2F6FDB" stop-opacity="0"/>
    </radialGradient>
    <filter id="shade" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="card"><rect width="1200" height="878" rx="28"/></clipPath>
    <style>
      /*FONT*/
      .f { font-family: 'IT', 'Inter Tight', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .grow { transform-box: fill-box; transform-origin: left center; animation: grow 9s cubic-bezier(.3,.8,.2,1) infinite; }
      .g2 { animation-delay: .2s } .g3 { animation-delay: .4s } .g4 { animation-delay: .6s }
      @keyframes grow { 0% { transform: scaleX(0); } 16%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
      .row { animation: row 1.2s cubic-bezier(.2,.7,.2,1) backwards; }
      @keyframes row { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .dot { animation: dot 6s linear infinite; }
      @keyframes dot { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 94% { opacity: 1; } 100% { transform: translateX(1088px); opacity: 0; } }
      .spin { animation: spin .22s linear infinite; transform-box: view-box; }
      .spin.r { animation-direction: reverse; }
      .spin.slow { animation-duration: .5s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .bob { animation: bob 5s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .warn { animation: warn 4s ease-out infinite; opacity: 0; }
      @keyframes warn { 0%, 55% { opacity: 0; } 62% { opacity: .9; } 100% { opacity: 0; } }
      .led { animation: led 2s steps(1) infinite; }
      @keyframes led { 50% { opacity: .3; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#card)" class="f">
    <rect width="1200" height="878" fill="#FFFFFF"/>
    <rect width="1200" height="878" fill="url(#glow)"/>

    <text x="56" y="66" font-size="15" fill="#6B7A8D">Flagship research</text>
    <text x="1144" y="66" font-size="15" fill="#6B7A8D" text-anchor="end">Manuscript in preparation · 2026</text>
    <text x="56" y="126" font-size="44" font-weight="500" fill="#0B2545" letter-spacing="-1.2">Learned recovery from partial rotor faults</text>
    <text x="56" y="164" font-size="18" fill="#4A5B70">Trained in Isaac Lab, judged with PX4 in the loop. A mission-level policy above an unmodified autopilot.</text>
    <line x1="56" y1="200" x2="1144" y2="200" stroke="#0B2545" stroke-opacity=".08"/>

    <!-- left: the quiet failure, drone illustration -->
    <ellipse cx="200" cy="396" rx="104" ry="12" fill="#0B2545" opacity=".07" filter="url(#shade)"/>
    <g transform="translate(200 318) scale(.62) translate(-892 -286)">
    <g class="bob">
      <g>
        <rect x="765" y="204.0" width="14" height="22" rx="3" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.3"/>
        <ellipse cx="772" cy="204.0" rx="7" ry="3.5" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.3"/>
        <g transform="translate(772 202.0) scale(1 .5)">
          <circle class="warn" r="80" fill="none" stroke="#E0782F" stroke-width="2"/>
          <circle r="78" fill="#2F6FDB" fill-opacity=".05" stroke="#2F6FDB" stroke-opacity=".38" stroke-width="1.2"/>
          <g class="spin slow">
            <line x1="-72" y1="0" x2="72" y2="0" stroke="#0B2545" stroke-width="3" stroke-linecap="round"/>
          </g>
          <circle r="6" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.3"/>
        </g>
      </g>
      <g>
        <rect x="1005" y="204.0" width="14" height="22" rx="3" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.3"/>
        <ellipse cx="1012" cy="204.0" rx="7" ry="3.5" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.3"/>
        <g transform="translate(1012 202.0) scale(1 .5)">
          
          <circle r="78" fill="#2F6FDB" fill-opacity=".05" stroke="#2F6FDB" stroke-opacity=".38" stroke-width="1.2"/>
          <g class="spin r">
            <line x1="-72" y1="0" x2="72" y2="0" stroke="#0B2545" stroke-width="3" stroke-linecap="round"/>
          </g>
          <circle r="6" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.3"/>
        </g>
      </g>
      <g transform="translate(892 286) scale(1 .5)"><line x1="0" y1="0" x2="-120" y2="-120" stroke="#0B2545" stroke-width="13" stroke-linecap="round"/><line x1="0" y1="0" x2="-120" y2="-120" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
<line x1="0" y1="0" x2="120" y2="-120" stroke="#0B2545" stroke-width="13" stroke-linecap="round"/><line x1="0" y1="0" x2="120" y2="-120" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
<line x1="0" y1="0" x2="-120" y2="120" stroke="#0B2545" stroke-width="13" stroke-linecap="round"/><line x1="0" y1="0" x2="-120" y2="120" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
<line x1="0" y1="0" x2="120" y2="120" stroke="#0B2545" stroke-width="13" stroke-linecap="round"/><line x1="0" y1="0" x2="120" y2="120" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/></g>
      <g transform="translate(892 302) scale(1 .5) rotate(45)"><rect x="-44" y="-44" width="88" height="88" rx="20" fill="#0B2545" /></g>
<g transform="translate(892 300) scale(1 .5) rotate(45)"><rect x="-44" y="-44" width="88" height="88" rx="20" fill="#D7E1EE" /></g>
<g transform="translate(892 298) scale(1 .5) rotate(45)"><rect x="-44" y="-44" width="88" height="88" rx="20" fill="#D7E1EE" /></g>
<g transform="translate(892 296) scale(1 .5) rotate(45)"><rect x="-44" y="-44" width="88" height="88" rx="20" fill="#D7E1EE" /></g>
<g transform="translate(892 294) scale(1 .5) rotate(45)"><rect x="-44" y="-44" width="88" height="88" rx="20" fill="#D7E1EE" /></g>
<g transform="translate(892 292) scale(1 .5) rotate(45)"><rect x="-44" y="-44" width="88" height="88" rx="20" fill="#D7E1EE" /></g>
<g transform="translate(892 290) scale(1 .5) rotate(45)"><rect x="-44" y="-44" width="88" height="88" rx="20" fill="#D7E1EE" /></g>
<g transform="translate(892 288) scale(1 .5) rotate(45)"><rect x="-44" y="-44" width="88" height="88" rx="20" fill="#D7E1EE" /></g>
      <g transform="translate(892 286) scale(1 .5) rotate(45)">
        <rect x="-44" y="-44" width="88" height="88" rx="20" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.4"/>
        <rect x="-24" y="-24" width="48" height="48" rx="11" fill="#EEF3FA" stroke="#0B2545" stroke-opacity=".35" stroke-width="1"/>
      </g>
      <circle class="led" cx="892" cy="286" r="4" fill="#23955A"/>
      <!-- landing gear -->
      <g stroke="#0B2545" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M 866 304 L 848 368"/><path d="M 918 304 L 936 368"/>
        <path d="M 818 360 L 878 378"/><path d="M 906 378 L 966 360"/>
      </g>
      <!-- gimbal camera -->
      <circle cx="892" cy="330" r="11" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.4"/>
      <circle cx="892" cy="331" r="4.5" fill="#0B2545"/>
      <circle cx="890.5" cy="329.5" r="1.3" fill="#FFFFFF"/>
      <g>
        <rect x="765" y="324.0" width="14" height="22" rx="3" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.3"/>
        <ellipse cx="772" cy="324.0" rx="7" ry="3.5" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.3"/>
        <g transform="translate(772 322.0) scale(1 .5)">
          
          <circle r="78" fill="#2F6FDB" fill-opacity=".05" stroke="#2F6FDB" stroke-opacity=".38" stroke-width="1.2"/>
          <g class="spin r">
            <line x1="-72" y1="0" x2="72" y2="0" stroke="#0B2545" stroke-width="3" stroke-linecap="round"/>
          </g>
          <circle r="6" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.3"/>
        </g>
      </g>
      <g>
        <rect x="1005" y="324.0" width="14" height="22" rx="3" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.3"/>
        <ellipse cx="1012" cy="324.0" rx="7" ry="3.5" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.3"/>
        <g transform="translate(1012 322.0) scale(1 .5)">
          
          <circle r="78" fill="#2F6FDB" fill-opacity=".05" stroke="#2F6FDB" stroke-opacity=".38" stroke-width="1.2"/>
          <g class="spin">
            <line x1="-72" y1="0" x2="72" y2="0" stroke="#0B2545" stroke-width="3" stroke-linecap="round"/>
          </g>
          <circle r="6" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.3"/>
        </g>
      </g>
    </g>

    </g>
    <text x="372" y="250" font-size="15" font-weight="600" fill="#C05F1E">The quiet failure</text>
    <g font-size="15.5" fill="#34475E">
      <text x="372" y="280">A rotor that loses part</text>
      <text x="372" y="302">of its thrust raises no alarm.</text>
      <text x="372" y="334">PX4's built-in failure</text>
      <text x="372" y="356">detector stayed silent on</text>
      <text x="372" y="378">all 178 mild-fault flights;</text>
      <text x="372" y="400">the autopilot flew on, degraded.</text>
    </g>

    <text x="56" y="458" font-size="15" fill="#6B7A8D">Missions completed</text>
    <text x="56" y="492" font-size="17" font-weight="500" fill="#0B2545">At 20–35% thrust loss</text>
    <text x="56" y="522" font-size="15" fill="#34475E">Learned policy</text>
    <text x="548" y="522" font-size="15" font-weight="600" fill="#2F6FDB" text-anchor="end">98%</text>
    <rect x="56" y="532" width="492" height="6" rx="3" fill="#E9EEF4"/>
    <rect class="grow" x="56" y="532" width="482" height="6" rx="3" fill="url(#dusk)"/>
    <text x="56" y="564" font-size="15" fill="#6B7A8D">Land on detection</text>
    <text x="548" y="564" font-size="15" font-weight="600" fill="#6B7A8D" text-anchor="end">29%</text>
    <rect x="56" y="574" width="492" height="6" rx="3" fill="#E9EEF4"/>
    <rect class="grow g2" x="56" y="574" width="142.7" height="6" rx="3" fill="#B8C2CF"/>

    <text x="56" y="626" font-size="17" font-weight="500" fill="#0B2545">Just below the hover limit</text>
    <text x="56" y="656" font-size="15" fill="#34475E">Learned policy</text>
    <text x="548" y="656" font-size="15" font-weight="600" fill="#2F6FDB" text-anchor="end">21%</text>
    <rect x="56" y="666" width="492" height="6" rx="3" fill="#E9EEF4"/>
    <rect class="grow g3" x="56" y="666" width="103.3" height="6" rx="3" fill="url(#dusk)"/>
    <text x="56" y="698" font-size="15" fill="#6B7A8D">Land on detection</text>
    <text x="548" y="698" font-size="15" font-weight="600" fill="#6B7A8D" text-anchor="end">1%</text>
    <rect x="56" y="708" width="492" height="6" rx="3" fill="#E9EEF4"/>
    <rect class="grow g4" x="56" y="708" width="6" height="6" rx="3" fill="#B8C2CF"/>

    <!-- right: numbers -->
    <g>
      <g class="row" style="animation-delay:.05s">
        <text x="636" y="266" font-size="34" font-weight="500" fill="#0B2545" letter-spacing="-1">9,054</text>
        <text x="840" y="256" font-size="16" fill="#1E3350">PX4-in-the-loop flights</text>
        <text x="840" y="278" font-size="14" fill="#6B7A8D">Pre-registered, Bonferroni-corrected</text>
      </g>
      <line x1="636" y1="300" x2="1144" y2="300" stroke="#0B2545" stroke-opacity=".08"/>
      <g class="row" style="animation-delay:.15s">
        <text x="636" y="344" font-size="34" font-weight="500" fill="#0B2545" letter-spacing="-1">32,768</text>
        <text x="840" y="334" font-size="16" fill="#1E3350">Drones on one GPU</text>
        <text x="840" y="356" font-size="14" fill="#6B7A8D">Isaac Lab, PyTorch port of PX4's controller</text>
      </g>
      <line x1="636" y1="378" x2="1144" y2="378" stroke="#0B2545" stroke-opacity=".08"/>
      <g class="row" style="animation-delay:.25s">
        <text x="636" y="422" font-size="34" font-weight="500" fill="#0B2545" letter-spacing="-1">95%</text>
        <text x="840" y="412" font-size="16" fill="#1E3350">Weak faults detected</text>
        <text x="840" y="434" font-size="14" fill="#6B7A8D">GRU ensemble, 0.88 s median delay</text>
      </g>
      <line x1="636" y1="456" x2="1144" y2="456" stroke="#0B2545" stroke-opacity=".08"/>
      <g class="row" style="animation-delay:.35s">
        <text x="636" y="500" font-size="34" font-weight="500" fill="#0B2545" letter-spacing="-1">98.6%</text>
        <text x="840" y="490" font-size="16" fill="#1E3350">Faulty rotor identified</text>
        <text x="840" y="512" font-size="14" fill="#6B7A8D">0.018 severity error</text>
      </g>
      <line x1="636" y1="534" x2="1144" y2="534" stroke="#0B2545" stroke-opacity=".08"/>
      <g class="row" style="animation-delay:.45s">
        <text x="636" y="578" font-size="34" font-weight="500" fill="#0B2545" letter-spacing="-1">30 / 32</text>
        <text x="840" y="568" font-size="16" fill="#1E3350">Crash conditions matched</text>
        <text x="840" y="590" font-size="14" fill="#6B7A8D">Isaac inside the PX4 95% interval</text>
      </g>
      <line x1="636" y1="612" x2="1144" y2="612" stroke="#0B2545" stroke-opacity=".08"/>
      <g class="row" style="animation-delay:.55s">
        <text x="636" y="656" font-size="34" font-weight="500" fill="#0B2545" letter-spacing="-1">5 Hz</text>
        <text x="840" y="646" font-size="16" fill="#1E3350">Mission-level decisions</text>
        <text x="840" y="668" font-size="14" fill="#6B7A8D">Speed, altitude, when to land. Never the motors.</text>
      </g>
      <line x1="636" y1="690" x2="1144" y2="690" stroke="#0B2545" stroke-opacity=".08"/>
      <g class="row" style="animation-delay:.65s">
        <text x="636" y="734" font-size="34" font-weight="500" fill="#0B2545" letter-spacing="-1">13</text>
        <text x="840" y="724" font-size="16" fill="#1E3350">Unseen generalization settings</text>
        <text x="840" y="746" font-size="14" fill="#6B7A8D">Tested beyond the training distribution</text>
      </g>
    </g>

    <!-- pipeline -->
    <line x1="56" y1="772" x2="1144" y2="772" stroke="#0B2545" stroke-opacity=".08"/>
    <circle class="dot" cx="56" cy="772" r="2.5" fill="#2F6FDB"/>
    <text x="56" y="806" font-size="15" fill="#34475E">Isaac Lab <tspan fill="#9AA6B5">→</tspan> versioned spec files <tspan fill="#9AA6B5">→</tspan> PX4 v1.17 SITL, Gazebo, ROS 2 <tspan fill="#9AA6B5" dx="14">|</tspan><tspan dx="14">GRU detector</tspan> <tspan fill="#9AA6B5">→</tspan> PPO policy <tspan fill="#9AA6B5">→</tspan> unmodified PX4 autopilot</text>
    <text x="56" y="846" font-size="15" fill="#6B7A8D"><tspan fill="#2F6FDB">Negative results, reported.</tspan> The policy does not reduce crashes, and a perfect, delayed or absent detector changes no outcome measurably.</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="877" rx="28" fill="none" stroke="#0B2545" stroke-opacity=".08"/>
</svg>
