    <g class="row" style="animation-delay:0.38s"><text x="237" y="652" font-size="32" font-weight="500" fill="#0B2545" letter-spacing="-1">153,876</text><text x="237" y="676" font-size="14" fill="#6B7A8D">detections</text></g>
    <g class="row" style="animation-delay:0.46s"><text x="419" y="652" font-size="32" font-weight="500" fill="#0B2545" letter-spacing="-1">37</text><text x="419" y="676" font-size="14" fill="#6B7A8D">occupations</text></g>
    <g class="row" style="animation-delay:0.54s"><text x="600" y="652" font-size="32" font-weight="500" fill="#23955A" letter-spacing="-1">76–78%</text><text x="600" y="676" font-size="14" fill="#6B7A8D">masked gaps refilled</text></g>
    <g class="row" style="animation-delay:0.62s"><text x="781" y="652" font-size="32" font-weight="500" fill="#0B2545" letter-spacing="-1">&lt;1.2%</text><text x="781" y="676" font-size="14" fill="#6B7A8D">false fills</text></g>
    <g class="row" style="animation-delay:0.70s"><text x="962" y="652" font-size="32" font-weight="500" fill="#0B2545" letter-spacing="-1">211</text><text x="962" y="676" font-size="14" fill="#6B7A8D">tests reproduce 122 values</text></g>
    <text x="56" y="712" font-size="14.5" fill="#6B7A8D"><tspan fill="#23955A">No ground truth.</tspan> Every threshold is calibrated from the data's own distributions. The stereo-depth stage didn't generalize, so it ships opt-in.</text>
