<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="744" viewBox="0 0 1200 744" role="img" aria-labelledby="title desc">
  <title id="title">A quality adapter for egocentric hand detection</title>
  <desc id="desc">Two film strips of video frames: the raw detector misses hands in some frames and fires false positives in others; after the adapter, false positives are rejected and missed frames are interpolated. Below, detections stream through the six stages: false positives are rejected at the geometric filter and temporal rejection stages, and missed detections are filled at gap interpolation.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="744" rx="28"/></clipPath>
    <style>
      /*FONT*/
      .f { font-family: 'IT', 'Inter Tight', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .d { transform-box: fill-box; transform-origin: center; }
      .ok  { animation: go 10.0s linear infinite; }
      .gap { animation: go 10.0s linear infinite, fill 10.0s linear infinite; }
      .fpa { animation: fpa 10.0s linear infinite; }
      .fpb { animation: fpb 10.0s linear infinite; }
      @keyframes go { from { transform: translateX(0); } to { transform: translateX(1240px); } }
      @keyframes fill { 0%, 54.8% { fill-opacity: 0; stroke-dasharray: 3 2; } 55.4%, 100% { fill-opacity: .9; stroke-dasharray: none; } }
      @keyframes fpa { 0% { transform: translateX(0) scale(1); opacity: 1; } 11.0% { transform: translateX(136px) scale(1); opacity: 1; } 14.0%, 100% { transform: translateX(173px) scale(2.4); opacity: 0; } }
      @keyframes fpb { 0% { transform: translateX(0) scale(1); opacity: 1; } 40.2% { transform: translateX(499px) scale(1); opacity: 1; } 43.2%, 100% { transform: translateX(536px) scale(2.4); opacity: 0; } }
      .flow { animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -16; } }
      .row { animation: row 1.2s cubic-bezier(.2,.7,.2,1) backwards; }
      @keyframes row { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#card)" class="f">
    <rect width="1200" height="744" fill="#FFFFFF"/>
    <text x="56" y="66" font-size="15" fill="#6B7A8D">Perception research</text>
    <text x="1144" y="66" font-size="15" fill="#6B7A8D" text-anchor="end">Manuscript complete · arXiv pending</text>
    <text x="56" y="126" font-size="44" font-weight="500" fill="#0B2545" letter-spacing="-1.2">A quality adapter for egocentric hand detection</text>
    <text x="56" y="164" font-size="18" fill="#4A5B70">Detector-agnostic post-processing that fixes false positives and false negatives without retraining.</text>
    <line x1="56" y1="200" x2="1144" y2="200" stroke="#0B2545" stroke-opacity=".08"/>

    <text x="56" y="264" font-size="16" font-weight="500" fill="#0B2545">Raw detector</text>
