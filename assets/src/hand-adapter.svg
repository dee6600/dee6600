    <g class="row" style="animation-delay:0.16s"><text x="419" y="556" font-size="13" fill="#9AA6B5">03</text><text x="419" y="578" font-size="15.5" fill="#1E3350">Temporal rejection</text></g>
    <g class="row" style="animation-delay:0.24s"><text x="600" y="556" font-size="13" fill="#9AA6B5">04</text><text x="600" y="578" font-size="15.5" fill="#1E3350">Gap interpolation</text></g>
