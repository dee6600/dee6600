<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Durgesh Reddiyar: safe and secure robot autonomy with reinforcement learning</title>
  <desc id="desc">An animated quadrotor flies a mission, loses 30 percent thrust on rotor 3, a learned detector isolates the fault, and a reinforcement learning policy recovers the mission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A16"/>
      <stop offset="1" stop-color="#0E1A34"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#16213F" stroke-width="1"/>
    </pattern>
    <linearGradient id="name" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="0.45" stop-color="#67E8F9"/>
      <stop offset="0.75" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F1F5F9"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1400 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="540" rx="20"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

      /* entrance */
      .rise { animation: rise 1s cubic-bezier(.2,.7,.2,1) backwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s } .d5 { animation-delay: 1.1s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

      /* drone */
      .bob { animation: bob 4s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      .tilt { animation: tilt 12s ease-in-out infinite; }
      @keyframes tilt {
        0%, 24% { transform: rotate(0deg) translateX(0); }
        30% { transform: rotate(-9deg) translateX(-10px); }
        36% { transform: rotate(6deg) translateX(6px); }
        44%, 50% { transform: rotate(-4deg) translateX(-4px); }
        58%, 100% { transform: rotate(0deg) translateX(0); }
      }
      .spin { animation: spin .32s linear infinite; }
      .spin.r { animation-direction: reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .disc { fill: #22D3EE; fill-opacity: .07; stroke: #22D3EE; stroke-opacity: .55; stroke-width: 1.5; }
      .blade { fill: #CFFAFE; fill-opacity: .85; }
      .m3disc { animation: m3disc 12s linear infinite; }
      @keyframes m3disc {
        0%, 24% { stroke: #22D3EE; fill: #22D3EE; }
        25%, 74% { stroke: #EF4444; fill: #EF4444; }
        75%, 100% { stroke: #F59E0B; fill: #F59E0B; }
      }
      .m3blade { animation: m3blade 12s linear infinite; }
      @keyframes m3blade { 0%, 24% { fill: #CFFAFE; } 25%, 74% { fill: #FCA5A5; } 75%, 100% { fill: #FDE68A; } }
      .alarm { animation: alarm 12s linear infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
      @keyframes alarm {
        0%, 25% { opacity: 0; transform: scale(.6); }
        26% { opacity: .9; transform: scale(.6); }
        33% { opacity: 0; transform: scale(1.8); }
        34% { opacity: .9; transform: scale(.6); }
        41% { opacity: 0; transform: scale(1.8); }
        42% { opacity: .9; transform: scale(.6); }
        49% { opacity: 0; transform: scale(1.8); }
        100% { opacity: 0; }
      }
      .led { animation: led 12s linear infinite; }
      @keyframes led { 0%, 24% { fill: #22C55E; } 25%, 49% { fill: #EF4444; } 50%, 74% { fill: #22D3EE; } 75%, 100% { fill: #A78BFA; } }

      /* radar */
      .ping { animation: ping 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .ping.b { animation-delay: 1.6s; }
      @keyframes ping { from { opacity: .55; transform: scale(.35); } to { opacity: 0; transform: scale(1.25); } }
      .orbit { animation: spin 14s linear infinite; }

      /* flight path */
      .path { stroke-dasharray: 2 10; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }

      /* thrust bars (horizontal) */
      .bar { transform-box: fill-box; transform-origin: left center; }
      .m1 { animation: m1 12s ease-in-out infinite; }
      .m2 { animation: m2 12s ease-in-out infinite; }
      .m3.m3fill { animation: m3 12s ease-in-out infinite, m3disc 12s linear infinite; }
      .m4 { animation: m4 12s ease-in-out infinite; }
      @keyframes m1 { 0%,24% { transform: scaleX(.62); } 30%,74% { transform: scaleX(.9); } 82%,100% { transform: scaleX(.78); } }
      @keyframes m2 { 0%,24% { transform: scaleX(.6); } 30%,74% { transform: scaleX(.7); } 82%,100% { transform: scaleX(.66); } }
      @keyframes m3 { 0%,24% { transform: scaleX(.61); } 28%,100% { transform: scaleX(.42); } }
      @keyframes m4 { 0%,24% { transform: scaleX(.63); } 30%,74% { transform: scaleX(.72); } 82%,100% { transform: scaleX(.67); } }

      /* console phases (12 s loop, 3 s each) */
      .ph { animation: ph 12s linear infinite; opacity: 0; }
      .ph.p1 { animation-delay: 0s; opacity: 1; }
      .ph.p2 { animation-delay: -9s; }
      .ph.p3 { animation-delay: -6s; }
      .ph.p4 { animation-delay: -3s; }
      @keyframes ph { 0% { opacity: 0; } 2%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-90px); } to { transform: translateY(540px); } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="540" fill="url(#bg)"/>
    <rect width="1200" height="540" fill="url(#grid)" opacity=".7"/>
    <circle cx="985" cy="245" r="300" fill="url(#glow)"/>
    <circle cx="200" cy="40" r="320" fill="url(#glow2)"/>
    <rect class="scan" x="790" y="0" width="410" height="90" fill="url(#scan)"/>

    <!-- ================= LEFT: identity ================= -->
    <g class="rise d1">
      <rect x="56" y="52" width="348" height="36" rx="18" fill="#0B1B33" stroke="#1E3A5F"/>
      <circle cx="78" cy="70" r="5" fill="#22C55E"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="94" y="76" class="mono" font-size="16" fill="#7DD3FC" letter-spacing="1.6">ROBOTICS RESEARCHER · PUNE</text>
    </g>

    <text x="52" y="178" class="sans rise d2" font-size="82" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Durgesh Reddiyar</text>

    <g class="sans rise d3" font-size="31">
      <text x="56" y="232" fill="#CBD5E1">Safe &amp; secure robot autonomy</text>
      <text x="56" y="272" fill="#CBD5E1">with <tspan fill="#67E8F9" font-weight="700">reinforcement learning</tspan></text>
    </g>

    <g class="rise d4 sans" font-size="16.5" font-weight="600">
      <rect x="56" y="300" width="214" height="40" rx="10" fill="#0F223F" stroke="#1E3A5F"/>
      <text x="163" y="326" text-anchor="middle" fill="#BAE6FD">🎓 M.S. Robotics · ASU</text>
      <rect x="282" y="300" width="246" height="40" rx="10" fill="#0F223F" stroke="#1E3A5F"/>
      <text x="405" y="326" text-anchor="middle" fill="#BAE6FD">🏭 2+ yrs industry robotics</text>
      <rect x="540" y="300" width="240" height="40" rx="10" fill="#2A1A4A" stroke="#8B5CF6"/>
      <text x="660" y="326" text-anchor="middle" fill="#DDD6FE">🚁 PX4 · Isaac Lab · ROS 2</text>
    </g>

    <!-- console -->
    <g class="rise d5">
      <rect x="56" y="366" width="724" height="134" rx="12" fill="#050914" stroke="#1E2A4A"/>
      <circle cx="78" cy="386" r="5.5" fill="#EF4444" opacity=".8"/>
      <circle cx="97" cy="386" r="5.5" fill="#F59E0B" opacity=".8"/>
      <circle cx="116" cy="386" r="5.5" fill="#22C55E" opacity=".8"/>
      <text x="418" y="391" text-anchor="middle" class="mono" font-size="13" fill="#475569">aero-safe-rl · PX4-in-the-loop</text>
      <text x="76" y="432" class="mono" font-size="17" fill="#64748B"><tspan fill="#22D3EE">$</tspan> ros2 launch aero_safe_rl mission.launch.py</text>
      <g class="mono" font-size="17">
        <text class="ph p1" x="76" y="470"><tspan fill="#22C55E" font-weight="700">[ OK ]</tspan><tspan fill="#CBD5E1"> 4/4 rotors nominal · tracking waypoints</tspan></text>
        <text class="ph p2" x="76" y="470"><tspan fill="#EF4444" font-weight="700">[WARN]</tspan><tspan fill="#CBD5E1"> rotor 3 −30% thrust · PX4 detector: </tspan><tspan fill="#F59E0B">silent</tspan></text>
        <text class="ph p3" x="76" y="470"><tspan fill="#22D3EE" font-weight="700">[ GRU]</tspan><tspan fill="#CBD5E1"> fault → rotor 3 · severity 0.30 · 0.88 s</tspan></text>
        <text class="ph p4" x="76" y="470"><tspan fill="#A78BFA" font-weight="700">[ PPO]</tspan><tspan fill="#CBD5E1"> slow · hold altitude · </tspan><tspan fill="#22C55E">mission complete ✓</tspan></text>
      </g>
      <rect class="cursor" x="752" y="456" width="10" height="19" fill="#22D3EE"/>
    </g>

    <!-- ================= RIGHT: drone ================= -->
    <!-- flight path -->
    <path class="path" d="M 815 410 C 870 350, 840 290, 930 250 S 1110 190, 1150 60" fill="none" stroke="#22D3EE" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="none" stroke="#22D3EE" stroke-opacity=".7" stroke-width="1.5">
      <rect x="1144" y="54" width="12" height="12" transform="rotate(45 1150 60)"/>
    </g>
    <text x="1142" y="40" class="mono" font-size="13" fill="#67E8F9" opacity=".8" text-anchor="middle">WP-4</text>

    <!-- radar -->
    <g transform="translate(985 240)">
      <circle r="168" fill="none" stroke="#1E3A5F" stroke-dasharray="3 7"/>
      <circle class="ping" r="168" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
      <circle class="ping b" r="168" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
      <g class="orbit">
        <circle cx="168" cy="0" r="4" fill="#67E8F9"/>
        <circle cx="-168" cy="0" r="3" fill="#A78BFA"/>
      </g>
    </g>

    <!-- quadrotor (top-down, X frame) -->
    <g transform="translate(985 240) scale(1.18)">
      <g class="bob">
        <g class="tilt">
          <ellipse cx="0" cy="116" rx="70" ry="9" fill="#000" opacity=".35"/>
          <g stroke="#334155" stroke-width="9" stroke-linecap="round">
            <line x1="0" y1="0" x2="66" y2="-66"/>
            <line x1="0" y1="0" x2="-66" y2="66"/>
            <line x1="0" y1="0" x2="-66" y2="-66"/>
            <line x1="0" y1="0" x2="66" y2="66"/>
          </g>
          <g stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity=".7">
            <line x1="0" y1="0" x2="66" y2="-66"/>
            <line x1="0" y1="0" x2="-66" y2="66"/>
            <line x1="0" y1="0" x2="-66" y2="-66"/>
            <line x1="0" y1="0" x2="66" y2="66"/>
          </g>

          <!-- M1 front-right -->
          <g transform="translate(66 -66)">
            <circle r="34" class="disc"/>
            <g class="spin"><ellipse rx="31" ry="4.5" class="blade"/></g>
            <circle r="6" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
          </g>
          <!-- M2 rear-left -->
          <g transform="translate(-66 66)">
            <circle r="34" class="disc"/>
            <g class="spin"><ellipse rx="31" ry="4.5" class="blade"/></g>
            <circle r="6" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
          </g>
          <!-- M3 front-left (faulty) -->
          <g transform="translate(-66 -66)">
            <circle r="34" class="alarm" fill="none" stroke="#EF4444" stroke-width="3"/>
            <circle r="34" class="disc m3disc"/>
            <g class="spin r"><ellipse rx="31" ry="4.5" class="blade m3blade"/></g>
            <circle r="6" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
          </g>
          <!-- M4 rear-right -->
          <g transform="translate(66 66)">
            <circle r="34" class="disc"/>
            <g class="spin r"><ellipse rx="31" ry="4.5" class="blade"/></g>
            <circle r="6" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
          </g>

          <!-- body -->
          <rect x="-26" y="-30" width="52" height="60" rx="14" fill="#0F172A" stroke="#22D3EE" stroke-width="2"/>
          <rect x="-15" y="-19" width="30" height="38" rx="7" fill="#13223F"/>
          <path d="M -8 -24 L 0 -36 L 8 -24 Z" fill="#22D3EE"/>
          <circle class="led" cx="0" cy="2" r="5" fill="#22C55E"/>
          <text x="-66" y="-108" class="mono" font-size="11" fill="#94A3B8" text-anchor="middle">M3</text>
          <text x="66" y="-108" class="mono" font-size="11" fill="#94A3B8" text-anchor="middle">M1</text>
        </g>
      </g>
    </g>

    <!-- thrust HUD -->
    <g transform="translate(830 424)">
      <rect x="0" y="0" width="330" height="96" rx="12" fill="#050914" fill-opacity=".88" stroke="#1E2A4A"/>
      <text x="16" y="22" class="mono" font-size="11.5" fill="#64748B" letter-spacing="1.2">MOTOR THRUST</text>
      <g class="mono" font-size="11" fill="#94A3B8">
        <text x="16" y="42">M1</text><text x="16" y="56">M2</text><text x="16" y="70">M3</text><text x="16" y="84">M4</text>
      </g>
      <g fill="#0F1B33">
        <rect x="44" y="34" width="270" height="9" rx="3"/>
        <rect x="44" y="48" width="270" height="9" rx="3"/>
        <rect x="44" y="62" width="270" height="9" rx="3"/>
        <rect x="44" y="76" width="270" height="9" rx="3"/>
      </g>
      <rect class="bar m1" x="44" y="34" width="270" height="9" rx="3" fill="#22D3EE"/>
      <rect class="bar m2" x="44" y="48" width="270" height="9" rx="3" fill="#22D3EE"/>
      <rect class="bar m3 m3fill" x="44" y="62" width="270" height="9" rx="3" fill="#22D3EE"/>
      <rect class="bar m4" x="44" y="76" width="270" height="9" rx="3" fill="#22D3EE"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="539" rx="20" fill="none" stroke="#1E2A4A"/>
</svg>
