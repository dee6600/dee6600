<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Detection quality adapter for egocentric hand detection</title>
  <desc id="desc">A six-stage, detector-agnostic post-processing pipeline. Animated detections flow through it: false positives are rejected at the geometric and temporal stages, and missing detections are filled at the gap interpolation stage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset="1" stop-color="#0D1830"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".1" stop-color="#22D3EE" stop-opacity=".5"/>
      <stop offset=".9" stop-color="#A78BFA" stop-opacity=".5"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1A2747"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="430" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

      .d { transform-box: fill-box; transform-origin: center; }
      .ok  { animation: go 7s linear infinite; }
      .gap { animation: go 7s linear infinite, fill 7s linear infinite; fill-opacity: 0; }
      .fpa { animation: fpa 7s linear infinite; }
      .fpb { animation: fpb 7s linear infinite; }
      @keyframes go { 0% { transform: translateX(0); opacity: 0; } 3%, 96% { opacity: 1; } 100% { transform: translateX(940px); opacity: 0; } }
      @keyframes fill { 0%, 57% { fill-opacity: 0; stroke-dasharray: 3 3; } 58%, 100% { fill-opacity: 1; stroke-dasharray: none; } }
      @keyframes fpa { 0% { transform: translateX(0) scale(1); opacity: 0; } 3% { opacity: 1; } 12.8% { transform: translateX(120px) scale(1); opacity: 1; } 16%, 100% { transform: translateX(150px) scale(2.8); opacity: 0; } }
      @keyframes fpb { 0% { transform: translateX(0) scale(1); opacity: 0; } 3% { opacity: 1; } 42.5% { transform: translateX(400px) scale(1); opacity: 1; } 46%, 100% { transform: translateX(430px) scale(2.8); opacity: 0; } }

      .gate { animation: gate 2.8s ease-in-out infinite; }
      @keyframes gate { 50% { stroke-opacity: .9; } }
      .beam { stroke-dasharray: 2 8; animation: beam 1s linear infinite; }
      @keyframes beam { to { stroke-dashoffset: -20; } }
      .tag { animation: tag 4.5s ease-in-out infinite; opacity: .35; }
      @keyframes tag { 0%, 100% { opacity: .35; } 15%, 40% { opacity: 1; } }
      .stat { animation: rise .9s cubic-bezier(.2,.7,.2,1) backwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .gap { fill-opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#dots)"/>

    <!-- header -->
    <rect x="40" y="34" width="420" height="26" rx="13" fill="#0B2433" stroke="#22D3EE" stroke-opacity=".6"/>
    <text x="250" y="52" text-anchor="middle" class="mono" font-size="12" fill="#A5F3FC" letter-spacing="1.2">02 · PERCEPTION RESEARCH · MANUSCRIPT [M2]</text>
    <text x="40" y="100" class="sans" font-size="30" font-weight="800" fill="#F1F5F9">Detection quality adapter for egocentric hand detection</text>
    <text x="40" y="124" class="sans" font-size="16" fill="#94A3B8">Detector-agnostic post-processing that fixes false positives <tspan fill="#F87171">and</tspan> false negatives without retraining, and tags every decision for audit.</text>

    <!-- stream -->
    <text x="40" y="168" class="mono" font-size="11" fill="#64748B" letter-spacing="1.5">RAW DETECTIONS</text>
    <line class="beam" x1="40" y1="212" x2="1010" y2="212" stroke="url(#beam)" stroke-width="2"/>

    <!-- gates: x = 180 + i*140 -->
    <g fill="none" stroke-width="2">
      <rect class="gate" x="170" y="180" width="20" height="64" rx="6" stroke="#F87171" stroke-opacity=".35"/>
      <rect class="gate" x="310" y="180" width="20" height="64" rx="6" stroke="#22D3EE" stroke-opacity=".35" style="animation-delay:.4s"/>
      <rect class="gate" x="450" y="180" width="20" height="64" rx="6" stroke="#F87171" stroke-opacity=".35" style="animation-delay:.8s"/>
      <rect class="gate" x="590" y="180" width="20" height="64" rx="6" stroke="#22C55E" stroke-opacity=".35" style="animation-delay:1.2s"/>
      <rect class="gate" x="730" y="180" width="20" height="64" rx="6" stroke="#A78BFA" stroke-opacity=".35" style="animation-delay:1.6s"/>
      <rect class="gate" x="870" y="180" width="20" height="64" rx="6" stroke="#64748B" stroke-opacity=".35" stroke-dasharray="4 4" style="animation-delay:2s"/>
    </g>

    <!-- detections -->
    <g stroke-width="2">
      <circle class="d ok"  cx="60" cy="204" r="6" fill="#22D3EE" stroke="#22D3EE" style="animation-delay:0s"/>
      <circle class="d fpa" cx="60" cy="222" r="6" fill="#EF4444" stroke="#EF4444" style="animation-delay:-0.7s"/>
      <circle class="d ok"  cx="60" cy="212" r="6" fill="#22D3EE" stroke="#22D3EE" style="animation-delay:-1.4s"/>
      <circle class="d gap" cx="60" cy="204" r="6" fill="#22C55E" stroke="#22C55E" style="animation-delay:-2.1s"/>
      <circle class="d ok"  cx="60" cy="220" r="6" fill="#22D3EE" stroke="#22D3EE" style="animation-delay:-2.8s"/>
      <circle class="d fpb" cx="60" cy="206" r="6" fill="#EF4444" stroke="#EF4444" style="animation-delay:-3.5s"/>
      <circle class="d ok"  cx="60" cy="214" r="6" fill="#22D3EE" stroke="#22D3EE" style="animation-delay:-4.2s"/>
      <circle class="d gap" cx="60" cy="222" r="6" fill="#22C55E" stroke="#22C55E" style="animation-delay:-4.9s"/>
      <circle class="d fpa" cx="60" cy="206" r="6" fill="#EF4444" stroke="#EF4444" style="animation-delay:-5.6s"/>
      <circle class="d ok"  cx="60" cy="210" r="6" fill="#22D3EE" stroke="#22D3EE" style="animation-delay:-6.3s"/>
    </g>

    <!-- stage labels -->
    <g class="sans" text-anchor="middle" font-size="12.5" font-weight="600">
      <text x="180" y="266" fill="#FCA5A5">Geometric filter</text>
      <text x="320" y="266" fill="#A5F3FC">Tracking</text>
      <text x="460" y="266" fill="#FCA5A5">Temporal rejection</text>
      <text x="600" y="266" fill="#86EFAC">Gap interpolation</text>
      <text x="740" y="266" fill="#C4B5FD">Track-ranked select</text>
      <text x="880" y="266" fill="#94A3B8">Stereo depth</text>
    </g>
    <g class="mono" text-anchor="middle" font-size="10.5" fill="#475569">
      <text x="180" y="284">− false positives</text>
      <text x="320" y="284">identity</text>
      <text x="460" y="284">− flicker</text>
      <text x="600" y="284">+ false negatives</text>
      <text x="740" y="284">best track wins</text>
      <text x="880" y="284">opt-in</text>
    </g>

    <!-- audit log -->
    <rect x="1020" y="162" width="140" height="102" rx="10" fill="#050914" stroke="#1E2A4A"/>
    <text x="1090" y="182" text-anchor="middle" class="mono" font-size="10" fill="#64748B" letter-spacing="1.2">AUDIT TAGS</text>
    <g class="mono" font-size="11.5">
      <text class="tag" x="1036" y="204" fill="#67E8F9">#kept</text>
      <text class="tag" x="1036" y="224" fill="#86EFAC" style="animation-delay:1.5s">#interpolated</text>
      <text class="tag" x="1036" y="244" fill="#FCA5A5" style="animation-delay:3s">#rejected</text>
    </g>

    <line x1="40" y1="310" x2="1160" y2="310" stroke="#1E2A4A"/>

    <!-- stats: x = 40 + i*190 -->
    <g class="sans">
      <g class="stat" style="animation-delay:.1s"><text x="40" y="346" font-size="24" font-weight="800" fill="#67E8F9">85,786</text><text x="40" y="366" font-size="12.5" fill="#94A3B8">frames, 39 stereo clips</text></g>
      <g class="stat" style="animation-delay:.25s"><text x="230" y="346" font-size="24" font-weight="800" fill="#A78BFA">153,876</text><text x="230" y="366" font-size="12.5" fill="#94A3B8">detections</text></g>
      <g class="stat" style="animation-delay:.4s"><text x="420" y="346" font-size="24" font-weight="800" fill="#67E8F9">37</text><text x="420" y="366" font-size="12.5" fill="#94A3B8">occupations</text></g>
      <g class="stat" style="animation-delay:.55s"><text x="610" y="346" font-size="24" font-weight="800" fill="#86EFAC">76–78%</text><text x="610" y="366" font-size="12.5" fill="#94A3B8">masked gaps refilled</text></g>
      <g class="stat" style="animation-delay:.7s"><text x="800" y="346" font-size="24" font-weight="800" fill="#FCA5A5">&lt;1.2%</text><text x="800" y="366" font-size="12.5" fill="#94A3B8">false fills</text></g>
      <g class="stat" style="animation-delay:.85s"><text x="990" y="346" font-size="24" font-weight="800" fill="#A78BFA">211 tests</text><text x="990" y="366" font-size="12.5" fill="#94A3B8">reproduce 122 paper values</text></g>
    </g>

    <text x="40" y="404" class="sans" font-size="13.5" fill="#94A3B8"><tspan fill="#F59E0B" font-weight="700">No ground truth:</tspan> every threshold calibrated from the data's own distributions. The stereo-depth stage didn't generalize, so it ships opt-in.</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="429" rx="18" fill="none" stroke="#1E2A4A"/>
</svg>
